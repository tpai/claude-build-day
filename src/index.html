<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鏡像維度 · Mirror Dimension</title>
<!--STYLE-->
</head>
<body>
<canvas id="view"></canvas>

<header id="title" aria-live="polite">
  <div id="cityName">—</div>
  <div id="citySub">—</div>
  <div id="timeChip">—</div>
</header>

<button id="lang" type="button" aria-label="Switch language">EN</button>

<aside id="panel">
  <button id="panelToggle" type="button" aria-expanded="true" aria-controls="panelBody">
    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="panelBody">
  <div class="row">
    <span class="label" data-i18n="city"></span>
    <div class="group" id="cities"></div>
  </div>
  <div class="row">
    <span class="label" data-i18n="time"></span>
    <div class="group" id="times"></div>
  </div>
  <div class="row">
    <span class="label" data-i18n="fold"></span>
    <div class="group" id="folds"></div>
  </div>
  <div class="row">
    <span class="label" data-i18n="sat"></span>
    <div class="group" id="sats"></div>
  </div>
  <div class="hint" data-i18n="hint"></div>
  <div class="foot"><span id="stats"></span><span id="attribution" data-i18n="attribution"></span></div>
  </div>
</aside>

<div id="loading"><div class="spinner"></div><div id="loadingText">載入中…</div></div>
<div id="fallback" hidden>
  <p>這個瀏覽器無法啟用 WebGL2,無法渲染鏡像維度。</p>
  <p>This browser cannot start WebGL2, so the mirror dimension cannot be rendered.</p>
</div>

<!--APP-->
</body>
</html>
